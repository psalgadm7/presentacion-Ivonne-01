<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Láminas Grupal 2 — Vista Vertical</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1c1e2a;
      --accent: #6c8ebf;
      --text: #d0d6e8;
      --muted: #7a8299;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", sans-serif;
    }

    /* ── Barra superior ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 17, 23, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #2a2d3e;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--accent);
      margin: 0;
      text-transform: uppercase;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .badge-count {
      background: #2a2d3e;
      color: var(--muted);
      border-radius: 20px;
      padding: 0.25rem 0.75rem;
      font-size: 0.82rem;
    }

    .btn-nav {
      background: #2a2d3e;
      color: var(--text);
      border: 1px solid #3a3d52;
      border-radius: 8px;
      padding: 0.3rem 0.85rem;
      font-size: 0.85rem;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-nav:hover {
      background: #3a3d52;
      color: #fff;
    }

    /* ── Buscador ── */
    #searchBox {
      background: #2a2d3e;
      border: 1px solid #3a3d52;
      border-radius: 8px;
      color: var(--text);
      padding: 0.3rem 0.75rem;
      font-size: 0.85rem;
      width: 170px;
      outline: none;
    }

    #searchBox::placeholder { color: var(--muted); }

    /* ── Grid principal ── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      padding: 1.5rem;
    }

    /* ── Tarjeta ── */
    .img-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .img-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65);
    }

    .img-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .img-card .card-footer-custom {
      padding: 0.5rem 0.75rem;
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ── Botón "arriba" ── */
    #toTop {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      z-index: 200;
      transition: opacity 0.2s;
    }

    #toTop:hover { opacity: 0.85; }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 500;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #lightbox.open { display: flex; }

    #lightbox img {
      max-width: 92vw;
      max-height: 82vh;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
      object-fit: contain;
    }

    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      font-size: 2rem;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .lb-nav:hover { background: rgba(255,255,255,0.25); }
    #lb-prev { left: 1rem; }
    #lb-next { right: 1rem; }

    #lb-close {
      position: absolute;
      top: 0.8rem;
      right: 1rem;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
    }

    #lb-counter {
      color: #aaa;
      margin-top: 0.75rem;
      font-size: 0.9rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>Láminas Grupal 2</h1>
    <div class="header-controls">
      <span class="badge-count">{{ images|length }} imágenes</span>
      <input type="text" id="searchBox" placeholder="Buscar por nombre…" oninput="filterImages(this.value)" />
      <a href="{{ url_for('index') }}" class="btn-nav">← Carrusel</a>
    </div>
  </header>

  {% if images %}
  <div class="gallery" id="gallery">
    {% for img in images %}
    <div class="img-card" data-name="{{ img }}" onclick="openLightbox({{ loop.index0 }})">
      <img
        src="{{ url_for('serve_lamina', filename=img) }}"
        alt="{{ img }}"
        loading="lazy"
      />
      <div class="card-footer-custom">
        <span>{{ img }}</span>
        <span>#{{ loop.index }}</span>
      </div>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <p style="color:#ff6b6b; padding:2rem;">No se encontraron imágenes en el directorio.</p>
  {% endif %}

  <!-- Botón subir -->
  <button id="toTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Subir">&#8679;</button>

  <!-- Lightbox -->
  <div id="lightbox">
    <button id="lb-close" onclick="closeLightbox()">&#x2715;</button>
    <button class="lb-nav" id="lb-prev" onclick="lbMove(-1)">&#8249;</button>
    <img id="lb-img" src="" alt="" />
    <button class="lb-nav" id="lb-next" onclick="lbMove(1)">&#8250;</button>
    <span id="lb-counter"></span>
  </div>

  <script>
    // Datos de imágenes para el lightbox
    const allImages = [
      {% for img in images %}
      { src: "{{ url_for('serve_lamina', filename=img) }}", name: "{{ img }}" }{% if not loop.last %},{% endif %}
      {% endfor %}
    ];

    // Filtro de tarjetas visibles (para lightbox y búsqueda)
    let visibleIndices = allImages.map((_, i) => i);
    let lbCurrent = 0;

    // ── Búsqueda ──
    function filterImages(query) {
      const q = query.trim().toLowerCase();
      const cards = document.querySelectorAll(".img-card");
      visibleIndices = [];
      cards.forEach((card, i) => {
        const name = card.dataset.name.toLowerCase();
        if (!q || name.includes(q)) {
          card.classList.remove("hidden");
          visibleIndices.push(i);
        } else {
          card.classList.add("hidden");
        }
      });
    }

    // ── Lightbox ──
    function openLightbox(index) {
      lbCurrent = visibleIndices.indexOf(index);
      if (lbCurrent === -1) lbCurrent = 0;
      updateLightbox();
      document.getElementById("lightbox").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      document.getElementById("lightbox").classList.remove("open");
      document.body.style.overflow = "";
    }

    function lbMove(dir) {
      lbCurrent = (lbCurrent + dir + visibleIndices.length) % visibleIndices.length;
      updateLightbox();
    }

    function updateLightbox() {
      const idx = visibleIndices[lbCurrent];
      const img = allImages[idx];
      document.getElementById("lb-img").src = img.src;
      document.getElementById("lb-img").alt = img.name;
      document.getElementById("lb-counter").textContent =
        `${lbCurrent + 1} / ${visibleIndices.length}`;
    }

    // Cerrar lightbox con Escape o clic en fondo
    document.addEventListener("keydown", (e) => {
      if (!document.getElementById("lightbox").classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") lbMove(-1);
      if (e.key === "ArrowRight") lbMove(1);
    });

    document.getElementById("lightbox").addEventListener("click", (e) => {
      if (e.target === document.getElementById("lightbox")) closeLightbox();
    });

    // ── Botón subir ──
    const toTopBtn = document.getElementById("toTop");
    window.addEventListener("scroll", () => {
      toTopBtn.style.display = window.scrollY > 300 ? "flex" : "none";
    });
  </script>
</body>
</html>
